<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20-8-2 Ergonomics Timer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 320px;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        #status { font-size: 1.5rem; font-weight: bold; margin: 1rem 0; color: #fbbf24; }
        #timer { font-size: 3rem; font-weight: bold; margin: 1rem 0; }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover { background-color: #0ea5e9; }
    </style>
</head>
<body>
    <div class="card">
        <h2>20-8-2 Routine</h2>
        <div id="status">Sit Phase</div>
        <div id="timer">20:00</div>
        <button id="toggleBtn" onclick="toggleTimer()">Start</button>
    </div>

    <script>
        const PHASES = [
            { name: "Sit Phase", duration: 20 * 60 },
            { name: "Stand Phase", duration: 8 * 60 },
            { name: "Move Phase", duration: 2 * 60 }
        ];
        
        let currentPhaseIndex = 0;
        let timeLeft = PHASES[currentPhaseIndex].duration;
        let timerId = null;
        let isRunning = false;

        const statusEl = document.getElementById("status");
        const timerEl = document.getElementById("timer");
        const toggleBtn = document.getElementById("toggleBtn");

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            timerEl.textContent = `${minutes}:${seconds}`;
            statusEl.textContent = PHASES[currentPhaseIndex].name;
        }

        function timerTick() {
            if (timeLeft > 0) {
                timeLeft--;
            } else {
                currentPhaseIndex = (currentPhaseIndex + 1) % PHASES.length;
                timeLeft = PHASES[currentPhaseIndex].duration;
                alert(`Time for ${PHASES[currentPhaseIndex].name}!`);
            }
            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                toggleBtn.textContent = "Start";
            } else {
                timerId = setInterval(timerTick, 1000);
                toggleBtn.textContent = "Pause";
            }
            isRunning = !isRunning;
        }

        updateDisplay();
    </script>
</body>
</html>
