<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standing Desk Timer</title>
    <style>
        :root {
            --bg-color: #0d1322;
            --card-bg: #131b2e;
            --card-active-bg: #182640;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --button-bg: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            justify-content: space-between;
            transition: background-color 0.3s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        .controls-top {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        select, button {
            background-color: var(--button-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            cursor: pointer;
        }
        select:hover, button:hover { background-color: var(--border-color); }
        button.primary {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            font-weight: 600;
        }
        button.primary:hover { opacity: 0.9; }
        
        .main-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            padding: 2rem;
            flex-grow: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .card.active {
            border-color: var(--accent-color);
            background-color: var(--card-active-bg);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
        }
        .card.active .card-header { color: var(--text-main); }
        .lock-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            color: var(--text-muted);
        }
        .lock-btn:hover { color: var(--text-main); }

        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: -1px;
            margin: auto 0;
        }
        .card-footer {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            align-items: center;
        }
        .card-footer button {
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            background-color: var(--button-bg);
        }
        .time-label { font-size: 0.875rem; color: var(--text-muted); margin: 0 0.5rem; }

        footer {
            display: flex;
            justify-content: space-between;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <h1>Standing Desk Timer</h1>
        <div class="controls-top">
            <select id="themeSelect" onchange="changeTheme()">
                <option value="Ocean Blue">Ocean Blue</option>
                <option value="Emerald Green">Emerald Green</option>
                <option value="Royal Purple">Royal Purple</option>
                <option value="Sunset Orange">Sunset Orange</option>
                <option value="Rose Red">Rose Red</option>
                <option value="Amber Gold">Amber Gold</option>
                <option value="Cyan Bright">Cyan Bright</option>
                <option value="Lime Fresh" selected>Lime Fresh</option>
                <option value="Fuchsia Pulse">Fuchsia Pulse</option>
                <option value="Slate Minimal">Slate Minimal</option>
            </select>
            <button onclick="previewAudio()">🔊 Preview</button>
            <button id="startBtn" class="primary" onclick="toggleWorkflow()">Start Workflow</button>
            <button onclick="resetTimer()">Reset</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Stand Card -->
        <div id="card-0" class="card active">
            <div class="card-header"><span>1. STAND</span></div>
            <div id="timer-0" class="timer-display">20:00</div>
            <div class="card-footer">
                <button onclick="adjustTime(0, -1)">-1m</button>
                <span id="dur-0" class="time-label">20 min</span>
                <button onclick="adjustTime(0, 1)">+1m</button>
            </div>
        </div>

        <!-- Sit Card -->
        <div id="card-1" class="card">
            <div class="card-header"><span>2. SIT</span></div>
            <div id="timer-1" class="timer-display">08:00</div>
            <div class="card-footer">
                <button onclick="adjustTime(1, -1)">-1m</button>
                <span id="dur-1" class="time-label">8 min</span>
                <button onclick="adjustTime(1, 1)">+1m</button>
            </div>
        </div>

        <!-- Move Card -->
        <div id="card-2" class="card">
            <div class="card-header">
                <span>3. MOVE / STRETCH</span>
                <button id="lockBtn" class="lock-btn" onclick="toggleLock()" title="Lock/Unlock Move Duration">🔒</button>
            </div>
            <div id="timer-2" class="timer-display">02:00</div>
            <div id="footer-2" class="card-footer">
                <span id="dur-2" class="time-label">2 min (Fixed)</span>
            </div>
        </div>
    </div>

    <footer>
        <div id="cyclesText">Daily Cycles Completed: 0</div>
        <div id="activeTimeText">Total Active Time: 0m</div>
    </footer>

    <script>
        const themes = {
            "Ocean Blue": { bg: "#0d1322", card: "#131b2e", activeCard: "#182640", border: "#1e293b", accent: "#38bdf8", sound: { type: "sine", startFreq: 150, endFreq: 600, duration: 0.5 } },
            "Emerald Green": { bg: "#0d1f12", card: "#132e1a", activeCard: "#193d24", border: "#1e3a23", accent: "#22c55e", sound: { type: "triangle", startFreq: 800, endFreq: 400, duration: 0.4 } },
            "Royal Purple": { bg: "#180d22", card: "#25132e", activeCard: "#331a3f", border: "#2e1e3a", accent: "#a855f7", sound: { type: "sawtooth", startFreq: 220, endFreq: 880, duration: 0.6 } },
            "Sunset Orange": { bg: "#22170d", card: "#2e2213", activeCard: "#3f2f1a", border: "#3a2d1e", accent: "#f97316", sound: { type: "square", startFreq: 500, endFreq: 200, duration: 0.4 } },
            "Rose Red": { bg: "#220d12", card: "#2e131b", activeCard: "#3f1a25", border: "#3a1e26", accent: "#f43f5e", sound: { type: "sawtooth", startFreq: 330, endFreq: 660, duration: 0.5 } },
            "Amber Gold": { bg: "#221d0d", card: "#2e2713", activeCard: "#3f361a", border: "#3a341e", accent: "#eab308", sound: { type: "sine", startFreq: 700, endFreq: 350, duration: 0.4 } },
            "Cyan Bright": { bg: "#0d1f22", card: "#132b2e", activeCard: "#19383c", border: "#1e353a", accent: "#06b6d4", sound: { type: "triangle", startFreq: 400, endFreq: 1200, duration: 0.3 } },
            "Lime Fresh": { bg: "#17220d", card: "#202e13", activeCard: "#2b3f1a", border: "#273a1e", accent: "#84cc16", sound: { type: "square", startFreq: 600, endFreq: 900, duration: 0.4 } },
            "Fuchsia Pulse": { bg: "#220d1f", card: "#2e132b", activeCard: "#3f1a3a", border: "#3a1e35", accent: "#d946ef", sound: { type: "sawtooth", startFreq: 200, endFreq: 1000, duration: 0.5 } },
            "Slate Minimal": { bg: "#0f172a", card: "#1e293b", activeCard: "#334155", border: "#334155", accent: "#64748b", sound: { type: "sine", startFreq: 300, endFreq: 150, duration: 0.4 } }
        };

        function changeTheme() {
            const selected = document.getElementById("themeSelect").value;
            const t = themes[selected];
            if (!t) return;
            const root = document.documentElement;
            root.style.setProperty('--bg-color', t.bg);
            root.style.setProperty('--card-bg', t.card);
            root.style.setProperty('--card-active-bg', t.activeCard);
            root.style.setProperty('--border-color', t.border);
            root.style.setProperty('--accent-color', t.accent);
        }

        document.getElementById("themeSelect").value = "Lime Fresh";
        changeTheme();

        const phases = [
            { name: "Stand", seconds: 20 * 60, defaultSecs: 20 * 60 },
            { name: "Sit", seconds: 8 * 60, defaultSecs: 8 * 60 },
            { name: "Move / Stretch", seconds: 2 * 60, defaultSecs: 2 * 60 }
        ];

        let currentPhase = 0;
        let timeLeft = phases[0].seconds;
        let isRunning = false;
        let timerInterval = null;
        let cyclesCompleted = 0;
        let totalActiveSeconds = 0;
        let isMoveLocked = true;
        const MAX_TOTAL_SECONDS = 30 * 60; // Maximum 30 minutes total cap

        function updateDisplay() {
            for (let i = 0; i < 3; i++) {
                const displaySecs = (i === currentPhase && isRunning) ? timeLeft : phases[i].seconds;
                const mins = Math.floor(displaySecs / 60).toString().padStart(2, '0');
                const secs = (displaySecs % 60).toString().padStart(2, '0');
                document.getElementById(`timer-${i}`).textContent = `${mins}:${secs}`;
                
                if (i < 2 || !isMoveLocked) {
                    document.getElementById(`dur-${i}`).textContent = `${phases[i].seconds / 60} min`;
                }
                
                const card = document.getElementById(`card-${i}`);
                if (i === currentPhase && isRunning) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            }

            document.getElementById('cyclesText').textContent = `Daily Cycles Completed: ${cyclesCompleted}`;
            const activeMins = Math.floor(totalActiveSeconds / 60);
            document.getElementById('activeTimeText').textContent = `Total Active Time: ${activeMins}m`;
        }

        function toggleLock() {
            if (isRunning) return;
            isMoveLocked = !isMoveLocked;
            const lockBtn = document.getElementById("lockBtn");
            const footer2 = document.getElementById("footer-2");

            if (isMoveLocked) {
                lockBtn.textContent = "🔒";
                footer2.innerHTML = `<span id="dur-2" class="time-label">${phases[2].seconds / 60} min (Fixed)</span>`;
            } else {
                lockBtn.textContent = "🔓";
                footer2.innerHTML = `
                    <button onclick="adjustTime(2, -1)">-1m</button>
                    <span id="dur-2" class="time-label">${phases[2].seconds / 60} min</span>
                    <button onclick="adjustTime(2, 1)">+1m</button>
                `;
            }
            updateDisplay();
        }

        function adjustTime(index, deltaMins) {
            if (isRunning) return;
            const deltaSecs = deltaMins * 60;

            if (isMoveLocked) {
                if (index === 0 || index === 1) {
                    const otherIndex = index === 0 ? 1 : 0;
                    const newTarget = phases[index].seconds + deltaSecs;
                    const otherTarget = phases[otherIndex].seconds - deltaSecs;

                    if (newTarget >= 60 && otherTarget >= 60) {
                        const newTotal = newTarget + otherTarget + phases[2].seconds;
                        if (newTotal <= MAX_TOTAL_SECONDS) {
                            phases[index].seconds = newTarget;
                            phases[index].defaultSecs = newTarget;
                            phases[otherIndex].seconds = otherTarget;
                            phases[otherIndex].defaultSecs = otherTarget;
                        }
                    }
                }
            } else {
                const newTarget = phases[index].seconds + deltaSecs;
                if (newTarget >= 60) {
                    const otherIndex = (index + 1) % 3;
                    const otherTarget = phases[otherIndex].seconds - deltaSecs;
                    const currentTotal = phases[0].seconds + phases[1].seconds + phases[2].seconds;
                    const potentialTotal = currentTotal + deltaSecs;

                    if (potentialTotal <= MAX_TOTAL_SECONDS && otherTarget >= 60) {
                        phases[index].seconds = newTarget;
                        phases[index].defaultSecs = newTarget;
                        phases[otherIndex].seconds = otherTarget;
                        phases[otherIndex].defaultSecs = otherTarget;
                    } else if (deltaSecs < 0) {
                        phases[index].seconds = newTarget;
                        phases[index].defaultSecs = newTarget;
                    }
                }
            }

            timeLeft = phases[currentPhase].seconds;
            updateDisplay();
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
                totalActiveSeconds++;
            } else {
                playAudioAlert();
                currentPhase++;
                if (currentPhase >= phases.length) {
                    currentPhase = 0;
                    cyclesCompleted++;
                }
                timeLeft = phases[currentPhase].seconds;
            }
            updateDisplay();
        }

        function toggleWorkflow() {
            const btn = document.getElementById('startBtn');
            if (isRunning) {
                clearInterval(timerInterval);
                btn.textContent = "Start Workflow";
                btn.classList.add('primary');
            } else {
                timerInterval = setInterval(tick, 1000);
                btn.textContent = "Pause Workflow";
                btn.classList.remove('primary');
            }
            isRunning = !isRunning;
            updateDisplay();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            currentPhase = 0;
            for(let i=0; i<3; i++) phases[i].seconds = phases[i].defaultSecs;
            timeLeft = phases[0].seconds;
            const btn = document.getElementById('startBtn');
            btn.textContent = "Start Workflow";
            btn.classList.add('primary');
            updateDisplay();
        }

        function playAudioAlert() {
            try {
                const selectedTheme = document.getElementById("themeSelect").value;
                const cfg = themes[selectedTheme].sound;
                
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = cfg.type;
                osc.frequency.setValueAtTime(cfg.startFreq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(cfg.endFreq, ctx.currentTime + cfg.duration);
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + cfg.duration + 0.1);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + cfg.duration + 0.1);
            } catch(e) {
                console.log("Audio not supported");
            }
        }

        function previewAudio() {
            playAudioAlert();
        }

        updateDisplay();
    </script>
</body>
</html>
