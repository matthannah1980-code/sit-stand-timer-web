<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standing Desk Timer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1322;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            justify-content: space-between;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #131b2e;
            border-bottom: 1px solid #1e293b;
        }
        h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        .controls-top {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        select, button {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            cursor: pointer;
        }
        button.primary {
            background-color: #0284c7;
            border-color: #0284c7;
            font-weight: 600;
        }
        button.primary:hover { background-color: #0369a1; }
        button:hover { background-color: #334155; }
        
        .main-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            padding: 2rem;
            flex-grow: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .card {
            background-color: #131b2e;
            border: 2px solid #1e293b;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .card.active {
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .card-header {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: left;
            color: #94a3b8;
        }
        .card.active .card-header { color: #f8fafc; }
        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: -1px;
            margin: auto 0;
        }
        .card-footer {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            align-items: center;
        }
        .card-footer button {
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            background-color: #1e293b;
        }
        .time-label { font-size: 0.875rem; color: #94a3b8; margin: 0 0.5rem; }

        footer {
            display: flex;
            justify-content: space-between;
            padding: 1rem 2rem;
            background-color: #131b2e;
            border-top: 1px solid #1e293b;
            font-size: 0.875rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <header>
        <h1>Standing Desk Timer</h1>
        <div class="controls-top">
            <select id="themeSelect">
                <option>Ocean Blue</option>
            </select>
            <button onclick="previewAudio()">🔊 Preview</button>
            <button id="startBtn" class="primary" onclick="toggleWorkflow()">Start Workflow</button>
            <button onclick="resetTimer()">Reset</button>
        </div>
    </header>

    <div class="main-container">
        <div id="card-0" class="card active">
            <div class="card-header">1. STAND</div>
            <div id="timer-0" class="timer-display">20:00</div>
            <div class="card-footer">
                <button onclick="adjustTime(0, -1)">-1m</button>
                <span id="dur-0" class="time-label">20 min</span>
                <button onclick="adjustTime(0, 1)">+1m</button>
            </div>
        </div>

        <div id="card-1" class="card">
            <div class="card-header">2. SIT</div>
            <div id="timer-1" class="timer-display">08:00</div>
            <div class="card-footer">
                <button onclick="adjustTime(1, -1)">-1m</button>
                <span id="dur-1" class="time-label">8 min</span>
                <button onclick="adjustTime(1, 1)">+1m</button>
            </div>
        </div>

        <div id="card-2" class="card">
            <div class="card-header">3. MOVE / STRETCH</div>
            <div id="timer-2" class="timer-display">02:00</div>
            <div class="card-footer">
                <span class="time-label">2 min (Fixed)</span>
            </div>
        </div>
    </div>

    <footer>
        <div id="cyclesText">Daily Cycles Completed: 0</div>
        <div id="activeTimeText">Total Active Time: 0m</div>
    </footer>

    <script>
        const phases = [
            { name: "Stand", duration: 20 * 60, defaultDur: 20 * 60 },
            { name: "Sit", duration: 8 * 60, defaultDur: 8 * 60 },
            { name: "Move / Stretch", duration: 2 * 60, defaultDur: 2 * 60 }
        ];

        let currentPhase = 0;
        let timeLeft = phases[currentPhase].duration;
        let isRunning = false;
        let timerInterval = null;
        let cyclesCompleted = 0;
        let totalActiveSeconds = 0;

        function updateDisplay() {
            for (let i = 0; i < 3; i++) {
                const mins = Math.floor(phases[i].duration / 60).toString().padStart(2, '0');
                const secs = (phases[i].duration % 60).toString().padStart(2, '0');
                document.getElementById(`timer-${i}`).textContent = `${mins}:${secs}`;
                
                const card = document.getElementById(`card-${i}`);
                if (i === currentPhase && isRunning) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            }

            // Update footer metrics
            document.getElementById('cyclesText').textContent = `Daily Cycles Completed: ${cyclesCompleted}`;
            const activeMins = Math.floor(totalActiveSeconds / 60);
            document.getElementById('activeTimeText').textContent = `Total Active Time: ${activeMins}m`;
        }

        function adjustTime(index, deltaMins) {
            if (isRunning) return; // Don't adjust while running
            let newDur = phases[index].duration + (deltaMins * 60);
            if (newDur >= 60) {
                phases[index].duration = newDur;
                document.getElementById(`dur-${index}`).textContent = `${newDur / 60} min`;
                if (index === currentPhase) timeLeft = newDur;
                updateDisplay();
            }
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
                phases[currentPhase].duration = timeLeft;
                totalActiveSeconds++;
            } else {
                playAudioAlert();
                currentPhase++;
                if (currentPhase >= phases.length) {
                    currentPhase = 0;
                    cyclesCompleted++;
                }
                timeLeft = phases[currentPhase].duration;
            }
            updateDisplay();
        }

        function toggleWorkflow() {
            const btn = document.getElementById('startBtn');
            if (isRunning) {
                clearInterval(timerInterval);
                btn.textContent = "Start Workflow";
                btn.classList.add('primary');
            } else {
                timerInterval = setInterval(tick, 1000);
                btn.textContent = "Pause Workflow";
                btn.classList.remove('primary');
            }
            isRunning = !isRunning;
            updateDisplay();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            currentPhase = 0;
            for(let i=0; i<3; i++) phases[i].duration = phases[i].defaultDur;
            timeLeft = phases[0].duration;
            const btn = document.getElementById('startBtn');
            btn.textContent = "Start Workflow";
            btn.classList.add('primary');
            updateDisplay();
        }

        function playAudioAlert() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5 note
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {
                console.log("Audio not supported");
            }
        }

        function previewAudio() {
            playAudioAlert();
        }

        updateDisplay();
    </script>
</body>
</html>
